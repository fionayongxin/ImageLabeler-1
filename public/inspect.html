<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Live PCB Inspection</title>
  <link rel="stylesheet" href="css/inspect.css">
</head>
<body>

<div class="trainer-container">

<div class="inspect-header">

  <h1>Live PCB Inspection</h1>

  <div id="resultOverlay" class="inspect-status unknown">
    NOT STARTED
  </div>

</div>

  <div class="inspect-layout">

  <!-- LEFT: CAMERA -->
  <div class="video-panel">
    <div class="camera-frame">
      <img id="liveCam"
           src=""
           class="camera-stream"
      />
      <div id="camPlaceholder" class="cam-placeholder">
        CAMERA NOT STARTED
      </div>
      </div>

  </div>

  <!-- RIGHT: CONTROL -->
  <div class="control-panel">
    <h3>Select Config</h3>

    <select>
      <option>99-003812-0X-HFQA</option>
      <option>PCB-TEST-001</option>
    </select>

    <button>Start</button>

    <p style="margin-top:10px;">SN: waiting</p>

    <div class="hint">
      Please choose a config and click "Start".
      Then scan the product SN to begin.
    </div>
  </div>

</div>
  </div>
</div>

<script src="js/inspect.js"></script>
</body>
</html>
