<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Live PCB Inspection</title>

  <!-- ✅ THIS WAS BROKEN BEFORE -->
  <link rel="stylesheet" href="/css/inspect.css" />
</head>

<body>
<div class="app-root">

  <!-- ================= HEADER ================= -->
  <header class="app-header">
    <div class="header-left">
      <span class="app-title">Live PCB Inspection</span>

      <div class="top-tabs">
        <button id="tabOperator" class="top-tab active">Operator</button>
        <button id="tabEngineer" class="top-tab">Engineer</button>
      </div>
    </div>

    <div id="headerStatus" class="status-pill status-unknown">
      WAITING
    </div>
  </header>

  <!-- ================= OPERATOR ================= -->
  <main class="stage operator-layout">
    <div class="stage-center">
      <div class="camera-frame">
        <img id="liveCam" class="camera-stream" />
        <canvas id="overlayCanvas"></canvas>

        <div id="camPlaceholder" class="cam-placeholder">
          CAMERA NOT STARTED
        </div>

        <div id="cameraResult" class="result-overlay status-unknown">
          WAITING
        </div>
      </div>
    </div>
  </main>

  <!-- ================= ENGINEER ================= -->
  <main class="stage engineer-layout hidden">
    <div class="stage-center">
      <div class="config-card">
        <h3>Inspection Configuration</h3>

        <label>Product / Program</label>
        <select>
          <option>Station 01 – Final Inspection</option>
        </select>

        <label>Model File</label>
        <input type="file" accept=".pt" />

        <label>Confidence Threshold</label>
        <input type="range" min="0" max="1" step="0.05" />
      </div>
    </div>
  </main>

</div>

<!-- ✅ THIS WAS ALSO BROKEN BEFORE -->
<script src="/js/inspect.js"></script>
</body>
</html>
