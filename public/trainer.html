
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Model Training</title>
  <link rel="stylesheet" href="/css/trainer.css">
  <script src="/vendor/chart.umd.js"></script></head>
<body>

  <!-- ================= NAVIGATION ================= -->
  <nav class="navbar">
    <div class="nav-brand">Vision Trainer</div>
    <ul class="nav-links">
      <li><a href="/trainer" class="active">Training</a></li>
      <li><a href="/experiments">Experiments</a></li>
      <li><a href="/datasets">Datasets</a></li>
      <li><a href="/settings">Settings</a></li>
    </ul>
  </nav>

  <!-- ================= MAIN ================= -->
  <div class="trainer-container">
    <h1>Model Training</h1>

    <!-- ===== Configuration ===== -->
    <label>Station</label>
    <input id="station" value="station_01" readonly>

    <label>Process</label>
    <input id="process" value="final_inspection" readonly>

    <label>Model</label>
    <select id="model">
      <option value="yolo26n.pt">YOLOv26 Nano</option>
      <option value="yolo26s.pt">YOLOv26 Small</option>
      <option value="yolo26m.pt">YOLOv26 Medium</option>
    </select>

    <label>Epochs</label>
    <input id="epochs" type="number" value="50">

    <label>Image Size</label>
    <input id="imgsz" type="number" value="640">

    <label>Batch Size</label>
    <input id="batch" type="number" value="8">

    <label>Run Name</label>
    <input id="runName" readonly>

    <!-- ===== Controls ===== -->
    <button id="startBtn">▶ Start Training</button>
    <button id="stopBtn" class="danger" disabled>■ Cancel Training</button>

    
    <div class="progress-container">
      <div id="progressBar" class="progress-bar"></div>
    </div>
    <div id="progressText">Idle</div>
    <div id="progressFile" class="progress-file">–</div>


    <!-- ================= METRICS =================
    <div class="metrics">
      <div class="metric">
        <span class="metric-label">mAP50</span>
        <span id="map50" class="metric-value">-</span>
      </div>
      <div class="metric">
        <span class="metric-label">Loss</span>
        <span id="loss" class="metric-value">-</span>
      </div>
    </div>
     -->

    <!-- ================= CHARTS ================= -->
    <h2 style="margin-top:30px;">Training Metrics</h2>
    <div class="chart-container">
      <canvas id="lossChart"></canvas>
    </div>
    <div class="chart-container">
      <canvas id="mapChart"></canvas>
    </div>
    <h3 style="margin-top: 24px;">mAP50</h3>
    <div class="chart-container">
      <canvas id="mapChart"></canvas>
    </div>

  </div>
