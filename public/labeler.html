<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Labeler</title>

  <!-- Shared base styles -->
  <link rel="stylesheet" href="/css/base.css" />

  <!-- Labeler-specific styles -->
  <link rel="stylesheet" href="/css/labeler.css" />
</head>

<body class="page-labeler">

  <!-- Root layout container for thumbnail panel and labeling workspace -->
  <div class="labeler-layout">

    <!-- Thumbnail panel populated dynamically with available images -->
    <aside class="thumb-panel">
      <h3>Images</h3>

      <!-- JS injects thumbnail elements here -->
      <div id="thumbs"></div>
    </aside>

    <!-- Main labeling work area -->
    <main class="work-panel">
      <!-- Displays currently selected image name or state -->
      <h3 id="currentImage">No image selected</h3>

      <div class="label-workspace">

        <!-- Image display and overlay canvas -->
        <section class="label-container">
          <!-- Active image under annotation -->
          <img id="image" alt="" />

          <!-- Canvas overlay used for read/draw interactions -->
          <canvas id="overlay" class="read-mode"></canvas>
        </section>

        <!-- Annotation and mode controls -->
        <aside class="label-controls">

          <!-- Mode selection (read vs draw) -->
          <section class="control-section">
            <h4 class="section-title">Mode</h4>

            <div class="mode-toggle">
              <button
                id="readModeBtn"
                class="secondary active"
                type="button"
              >
                Read
              </button>

              <button
                id="drawModeBtn"
                class="secondary"
                type="button"
              >
                Draw
              </button>
            </div>
          </section>

          <!-- Annotation class selection and save action -->
          <section class="control-section">
            <h4 class="section-title">Annotation</h4>

            <label for="classSelect" class="control-label">
              Class
            </label>

            <select id="classSelect">
              <option value="">-- Select --</option>
              <option value="ok">OK</option>
              <option value="defect">Defect</option>
              <option value="scratch">Scratch</option>
            </select>

            <!-- Persists current annotations in YOLO format -->
            <button
              id="saveYoloBtn"
              class="primary-action"
              type="button"
            >
              Save Annotations
            </button>
            <!-- Enable user to delete image taken-->
            <button id="deleteImageBtn" class="danger" disabled>
              Delete Image
            </button>

          </section>

          <!-- Current application status feedback -->
          <section class="control-section status-section">
            <h4 class="section-title">Status</h4>

            <!-- Updated dynamically by JS based on mode and actions -->
            <p id="status" class="status-text">Read mode</p>
          </section>

        </aside>
      </div>
    </main>

  </div>

  <!-- Labeling application logic -->
  <script src="js/labeler.js"></script>

</body>
</html>
