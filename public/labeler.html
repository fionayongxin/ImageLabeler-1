<!DOCTYPE html>
<title>InteractiveUI</title>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Labeler</title>

  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/labeler.css">
</head>

<body class="page-labeler">

<div class="labeler-layout">

  <aside class="thumb-panel">
    <h3>Images</h3>
    <div id="thumbs"></div>
  </aside>

  <main class="work-panel">
    <h3 id="currentImage">No image selected</h3>

    <div class="label-workspace">

      <section class="label-container">
        <img id="image" alt="">
        <canvas id="overlay" class="read-mode"></canvas>
      </section>

      <aside class="label-controls">

        <h4>Mode</h4>
        <div class="mode-toggle">
          <button id="readModeBtn" class="secondary active">Read</button>
          <button id="drawModeBtn" class="secondary">Draw</button>
        </div>

        <h4>Class</h4>
        <select id="classSelect">
          <option value="">-- Select --</option>
          <option value="ok">OK</option>
          <option value="defect">Defect</option>
          <option value="scratch">Scratch</option>
        </select>

        <button id="saveYoloBtn">Save YOLO</button>
        <p id="status"></p>

      </aside>

    </div>
  </main>
</div>

<script src="js/labeler.js"></script>
</body>
</html>
