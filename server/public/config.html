<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Inspection Config</title>
  <link rel="stylesheet" href="/css/config.css" />
</head>
<body>

<div class="trainer-container">

  <div class="inspect-header">
    <h1>Inspection Configuration</h1>
  </div>

  <div class="inspect-layout">

    <!-- LEFT: PRODUCT + STEP LIST -->
    <div class="control-panel">

  <h3>Product Config</h3>
  <select id="productSelect">
    <option>99-003812-0X-HFQA</option>
    <option>PCB-TEST-001</option>
  </select>

  <!-- spacer pushes buttons to bottom -->
  <div class="panel-spacer"></div>

  <!-- ACTIONS -->
  <div class="panel-actions">
    <button onclick="saveConfig()">Save Config</button>
    <button class="danger" onclick="deleteCurrentStep()">Delete Step</button>
  </div>

</div>

    <!-- RIGHT: STEP EDITOR -->
<div class="video-panel">

  <h3>Step Editor</h3>

  <!-- STEP SELECTOR (JS renders here) -->
  <div class="step-tabs" id="stepTabs"></div>

  <!-- STEP BODY -->
  <div class="step-editor-body">

    <div class="step-column">
      <h4>Required Components</h4>
      <div class="class-box">
        <label><input type="checkbox" class="required-checkbox" value="T_2_label"> T_2_label</label>
        <label><input type="checkbox" class="required-checkbox" value="T_Body"> T_Body</label>
        <label><input type="checkbox" class="required-checkbox" value="T_Bushing"> T_Bushing</label>
        <label><input type="checkbox" class="required-checkbox" value="T_Hole_Plug"> T_Hole_Plug</label>
        <label><input type="checkbox" class="required-checkbox" value="T_Inner_opening"> T_Inner_opening</label>
      </div>
    </div>

    <div class="step-column">
      <h4>Error Components</h4>
      <div class="class-box error">
        <label><input type="checkbox" class="forbidden-checkbox" value="T_2_label"> T_2_label</label>
        <label><input type="checkbox" class="forbidden-checkbox" value="T_Body"> T_Body</label>
        <label><input type="checkbox" class="forbidden-checkbox" value="T_Bushing"> T_Bushing</label>
        <label><input type="checkbox" class="forbidden-checkbox" value="T_Hole_Plug"> T_Hole_Plug</label>
        <label><input type="checkbox" class="forbidden-checkbox" value="T_Inner_opening"> T_Inner_opening</label>
      </div>
    </div>

  </div>
</div>

  </div>
</div>

<script src="/js/config.js"></script>
</body>
</html>
