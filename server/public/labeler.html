<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Labeler</title>

  <!-- Shared base styles -->
  <link rel="stylesheet" href="/css/base.css" />

  <!-- Labeler-specific styles -->
  <link rel="stylesheet" href="/css/labeler.css" />
</head>

<body class="page-labeler">

  <!-- Root layout: thumbnails + labeling workspace -->
  <div class="labeler-layout">

    <!-- LEFT: Thumbnail panel -->
    <aside class="thumb-panel">
      <h3>Images</h3>
      <div id="thumbs"></div>
    </aside>

    <!-- RIGHT: Labeling workspace -->
    <main class="work-panel">

      <h3 id="currentImage">No image selected</h3>

      <div class="label-workspace">

        <!-- ==============================
             IMAGE + OVERLAY (CRITICAL FIX)
             ============================== -->
        <section class="label-container">

          <!-- Base image (bottom layer) -->
          <img
            id="image"
            alt=""
          />

          <!-- Canvas overlay (always on top) -->
          <canvas
            id="overlay"
            class="read-mode"
          ></canvas>

        </section>

        <!-- RIGHT: Controls -->
        <aside class="label-controls">

          <!-- MODE -->
          <section class="control-section">
            <h4 class="section-title">Mode</h4>

            <div class="mode-toggle">
              <button
                id="readModeBtn"
                class="secondary active"
                type="button">
                Read
              </button>

              <button
                id="drawModeBtn"
                class="secondary"
                type="button">
                Draw
              </button>
            </div>
          </section>

          <!-- ANNOTATION -->
          <section class="control-section">
            <h4 class="section-title">Annotation</h4>

            <label for="classSelect">Class</label>

            <select id="classSelect">
              <option value="">-- Select --</option>
              <option value="ok">OK</option>
              <option value="defect">Defect</option>
              <option value="scratch">Scratch</option>
            </select>

            <button
              id="saveYoloBtn"
              class="primary-action"
              type="button">
              Save Annotations
            </button>

            <button
              id="deleteImageBtn"
              class="danger"
              disabled>
              Delete Image
            </button>
          </section>

          <!-- STATUS -->
          <section class="control-section status-section">
            <h4 class="section-title">Status</h4>
            <p id="status" class="status-text">Read mode</p>
          </section>

        </aside>
      </div>
    </main>
  </div>

  <!-- Labeling logic -->
  <script src="js/labeler.js"></script>

</body>
</html>
