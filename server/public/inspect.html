<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Live PCB Inspection</title>

  <!-- Main stylesheet -->
  <link rel="stylesheet" href="/css/inspect.css" />
</head>

<body>
<div class="app-root">

  <!-- ======================================================
       HEADER
  ====================================================== -->
  <header class="app-header">

    <div class="header-left">
      <span class="app-title">Live PCB Inspection</span>

      <div class="top-tabs">
        <button id="tabOperator" class="top-tab active">Operator</button>
        <button id="tabEngineer" class="top-tab">Engineer</button>
      </div>
    </div>

    <div id="headerStatus" class="status-pill status-unknown">
      WAITING
    </div>

  </header>


  <!-- ======================================================
       OPERATOR VIEW
       - Select LOCAL config folder
       - System auto loads model + JSON
  ====================================================== -->
  <main class="stage operator-layout">

    <div class="operator-grid">

      <!-- CENTER: Camera -->
      <div class="stage-center">
        <div class="camera-frame">

          <img id="liveCam" class="camera-stream" />
          <canvas id="overlayCanvas"></canvas>

          <div id="camPlaceholder" class="cam-placeholder">
            CAMERA NOT STARTED
          </div>

          <div id="cameraResult" class="result-overlay status-unknown">
            WAITING
          </div>

        </div>
      </div>

      <!-- RIGHT: Operator Control Panel -->
      <div class="panel operator-panel">

        <h4>Inspection Control</h4>

        <div class="form-block">

          <!-- ✅ Local config selection -->
          <label>Config (Local)</label>
          <select id="operatorConfigSelect"></select>

          <!-- ✅ Step selection -->
          <label>Current Step</label>
          <select id="operatorStepSelect"></select>

          <!-- ✅ Runtime status -->
          <div class="operator-info">
            <div>
              <strong>Status:</strong>
              <span id="operatorStatus">WAITING</span>
            </div>
          </div>

        </div>

      </div>

    </div>

  </main>


  <!-- ======================================================
       ENGINEER VIEW
       - Create config
       - Upload model
       - Define steps
       - Save → local folder
  ====================================================== -->
  <main class="stage engineer-layout hidden">

    <div class="engineer-grid">

      <!-- ================= LEFT PANEL ================= -->
      <div class="panel left-panel">

        <h4>Configs (Local)</h4>

        <!-- ✅ Represents local config folders -->
        <div id="configList" class="config-list"></div>

        <div class="config-actions">
          <button id="addConfigBtn">Add Config</button>
          <button id="deleteConfigBtn" class="danger">Delete Config</button>
          <button id="saveConfigBtn" class="primary">Save to Local</button>
        </div>

      </div>


      <!-- ================= CENTER PANEL ================= -->
      <div class="panel center-panel">

        <h4>Config Details</h4>

        <div class="form-block">

          <!-- ✅ Config name (maps to folder name) -->
          <label>Name</label>
          <input id="configName" />

          <!-- ✅ Model upload -->
          <label>Model (.pt)</label>
          <div class="file-input">
            <input type="file" id="modelFile" accept=".pt" hidden />
            <button type="button" id="fileBtn">Upload Model</button>
            <span id="fileName">No file selected</span>
          </div>

          <!-- ✅ Model validation state -->
          <div class="hint" id="modelStatus">
            No model loaded
          </div>

          <!-- ✅ Confidence -->
          <label>
            Confidence Threshold
            <span class="hint">(0.00 – 1.00)</span>
          </label>

          <input
            type="number"
            id="confidence"
            min="0"
            max="1"
            step="0.01"
            placeholder="0.50"
          />
        </div>

      </div>


      <!-- ================= RIGHT PANEL ================= -->
      <div class="panel right-top">

        <!-- ✅ Read-only classes from model -->
        <h4>Classes (Read-only)</h4>
        <div id="classList" class="class-view"></div>

      </div>


      <!-- ================= STEPS PANEL ================= -->
      <div class="panel steps-panel">

        <div class="steps-header">

          <h4>Steps</h4>

        </div>

        <div class="steps-container">

          <!-- Step list -->
          <div class="steps-list">
            <div id="stepsList"></div>

            <button id="addStepBtn">Add Step</button>
            <button id="deleteStepBtn" class="danger">Delete Step</button>
          </div>

          <!-- Step editor -->
          <div class="steps-editor">

            <div class="step-editor-body">

              <!-- ✅ Required classes -->
              <div class="step-column">
                <h5>Required</h5>
                <div class="steps-required class-box"></div>
              </div>

              <!-- ✅ Forbidden classes -->
              <div class="step-column">
                <h5>Forbidden</h5>
                <div class="steps-forbidden class-box error"></div>
              </div>

            </div>

          </div>

        </div>

      </div>

    </div>

  </main>

</div>

<!-- ======================================================
     MAIN LOGIC
====================================================== -->
<script src="/js/inspect.js"></script>

</body>
</html>
