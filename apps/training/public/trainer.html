<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Model Training</title>

  <!-- Shared base styles -->
  <link rel="stylesheet" href="/training/css/base.css" />

  <!-- Trainer page–specific styles -->
  <link rel="stylesheet" href="/training/css/trainer.css" />

  <!-- Chart.js library used for training metrics visualization -->
  <script src="/training/vendor/chart.umd.js"></script>
</head>

<body>

  <!-- Root container for the training application -->
  <div class="trainer-page">

    <!-- =========================================
         TOP NAVIGATION BAR
         Stable structure used across trainer pages
         ========================================= -->
    <nav class="navbar">
      <div class="nav-brand">Vision Trainer</div>

      <ul class="nav-links">
        <li><a href="/training" class="active">Training</a></li>
        <li><a href="/experiments">Experiments</a></li>
        <li><a href="/datasets">Datasets</a></li>
        <li><a href="/settings">Settings</a></li>
      </ul>
    </nav>

    <!-- =========================================
         MAIN TRAINING WORKSPACE
         ========================================= -->
    <main class="trainer-main">

      <!-- -----------------------------------------
           LEFT COLUMN: CONFIGURATION & PROGRESS
           ----------------------------------------- -->
      <section class="trainer-config">

        <!-- Training configuration inputs -->
        <div class="config-panel">
          <h2>Configuration</h2>

          <label>Station</label>
          <input id="station" readonly />

          <label>Process</label>
          <input id="process" readonly />

          <label>Model</label>
          <select id="model">
            <option value="yolo26n.pt">YOLOv26 Nano</option>
            <option value="yolo26s.pt">YOLOv26 Small</option>
            <option value="yolo26m.pt">YOLOv26 Medium</option>
          </select>

          <label>Epochs</label>
          <input id="epochs" type="number" value="50" />

          <label>Image Size</label>
          <input id="imgsz" type="number" value="640" />

          <label>Batch Size</label>
          <input id="batch" type="number" value="8" />

          <label>Run Name</label>
          <input id="runName" readonly />

          <!-- Training lifecycle controls -->
          <button id="startBtn" type="button">▶ Start Training</button>
          <button id="stopBtn" class="danger" type="button" disabled>
            ■ Cancel Training
          </button>
        </div>

        <!-- Training progress feedback -->
        <div class="progress-panel">
          <div class="progress-container">
            <!-- Width controlled dynamically by JS -->
            <div id="progressBar" class="progress-bar"></div>
          </div>

          <div id="progressText" class="progress-text">Idle</div>
          <div id="progressFile" class="progress-file">–</div>
        </div>

      </section>

      <!-- -----------------------------------------
           RIGHT COLUMN: TRAINING METRICS
           Charts rendered via Chart.js
           ----------------------------------------- -->
      <section class="trainer-metrics">

        <!-- Loss over epochs -->
        <div class="chart-container">
          <canvas id="lossChart"></canvas>
        </div>

        <!-- mAP / accuracy over epochs -->
        <div class="chart-container">
          <canvas id="mapChart"></canvas>
        </div>

      </section>

    </main>

  </div>

  <!-- Trainer application logic -->
  <script src="/training/js/trainer.js"></script>
</body>
</html>
