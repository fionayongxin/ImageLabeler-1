<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Datasets</title>

  <!-- Shared base styles -->
  <link rel="stylesheet" href="/training/css/base.css" />

  <!-- Dataset page–specific styles -->
  <link rel="stylesheet" href="/training/css/datasets.css" />
</head>

<body>

  <!-- =========================================
       TOP NAVIGATION
       ========================================= -->
  <nav class="navbar">
    <div class="nav-brand">Vision Trainer</div>

    <ul class="nav-links">
      <li><a href="/training">Training</a></li>
      <li><a href="/experiments">Experiments</a></li>
      <li><a href="/datasets" class="active">Datasets</a></li>
      <li><a href="/settings">Settings</a></li>
    </ul>
  </nav>

  <!-- =========================================
       MAIN PAGE CONTAINER
       ========================================= -->
  <div class="trainer-container">

    <!-- Page heading -->
    <h1>Datasets</h1>

    <!-- =========================================
         FILTER / TOOLBAR
         Station & process selection drives loading
         ========================================= -->
    <div class="dataset-toolbar">
      <div class="dataset-info">

        <label>Station</label>
        <select id="station">
          <option value="ALL">All Stations</option>
          <option value="station_01">station_01</option>
          <option value="station_02">station_02</option>
        </select>

        <label>Process</label>
        <select id="process">
          <option value="ALL">All Processes</option>
          <option value="final_inspection">final_inspection</option>
          <option value="pre_inspection">pre_inspection</option>
        </select>

      </div>
    </div>

    <!-- =========================================
         STATUS MESSAGE
         Used for loading / empty states
         ========================================= -->
    <div id="datasetStatus" class="dataset-status"></div>

    <!-- =========================================
         SCROLLABLE IMAGE GALLERY
         ========================================= -->
    <div class="datasets-gallery-wrapper">
      <!-- Thumbnails injected dynamically by JS -->
      <div id="gallery" class="gallery"></div>
    </div>

    <!-- =========================================
         PAGINATION CONTROLS
         Same behavior as Experiments page
         ========================================= -->
    <div class="table-pagination">
      <button id="prevPage" type="button">Previous</button>

      <span>Page</span>
      <input
        id="pageInput"
        type="number"
        min="1"
        step="1"
        aria-label="Jump to page"
      />
      <span id="pageInfo"></span>

      <button id="nextPage" type="button">Next</button>
      <button id="goPage" type="button">Go</button>
    </div>

  </div>

  <!-- Dataset page logic -->
  <script src="/training/js/datasets.js"></script>
</body>
</html>
