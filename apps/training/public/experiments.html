<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Experiments</title>

  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Shared base styles -->
  <link rel="stylesheet" href="/training/css/base.css" />

  <!-- Experiments page styles -->
  <link rel="stylesheet" href="/training/css/experiments.css" />

  <!-- Chart library for metrics visualization -->
  <script src="/training/vendor/chart.umd.js"></script>
</head>

<body>

  <!-- Top navigation -->
  <nav class="navbar">
    <div class="nav-brand">Vision Trainer</div>

    <ul class="nav-links">
      <li><a href="/training">Training</a></li>
      <li><a href="/experiments" class="active">Experiments</a></li>
      <li><a href="/datasets">Datasets</a></li>
      <li><a href="/settings">Settings</a></li>
    </ul>
  </nav>

  <!-- Main content container -->
  <main class="trainer-container">
    <h1>Experiments</h1>

    <!-- Scrollable experiments table -->
    <div class="experiments-table-wrapper">
      <table id="experimentsTable">
        <thead>
          <tr>
            <th scope="col">Run Name</th>
            <th scope="col">Status</th>
            <th scope="col">Model</th>
            <th scope="col">Dataset</th>
            <th scope="col">Batch Size</th>
            <th scope="col">Epochs</th>
            <th scope="col">Image Size</th>
            <th scope="col">Started At</th>
            <th scope="col">Actions</th>
          </tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>

    <!-- Pagination controls (always visible) -->
    <div class="table-pagination">
      <button id="prevPage" type="button">Previous</button>

      <span>Page</span>
      <input
        id="pageInput"
        type="number"
        min="1"
        step="1"
        aria-label="Jump to page"
      />
      <span id="pageInfo">of 1</span>

      <button id="nextPage" type="button">Next</button>
      <button id="goPage" type="button">Go</button>
    </div>

    <!-- Metrics side panel -->
    <aside id="metricsPanel" class="metrics-panel">

      <div class="metrics-header">
        <h2>Training Metrics</h2>
        <button id="closeMetrics" class="btn-secondary" type="button">
          Close
        </button>
      </div>

      <!-- Summary metrics -->
      <div class="metrics-summary">
        <div class="metric-card">
          <span class="label">Final Epoch</span>
          <span class="value" id="finalEpoch">-</span>
        </div>

        <div class="metric-card">
          <span class="label">Final Loss</span>
          <span class="value" id="finalLoss">-</span>
        </div>

        <div class="metric-card">
          <span class="label">Best mAP50</span>
          <span class="value" id="bestMap">-</span>
        </div>
      </div>

      <!-- Charts -->
      <div class="metrics-charts">
        <div class="chart-card">
          <h3>Training Loss</h3>
          <canvas id="lossChart"></canvas>
        </div>

        <div class="chart-card">
          <h3>mAP50</h3>
          <canvas id="mapChart"></canvas>
        </div>
      </div>

    </aside>

  </main>

  <!-- Backdrop used when metrics panel is active -->
  <div id="metricsBackdrop" class="metrics-backdrop"></div>

  <!-- Page logic -->
  <script src="/training/js/experiments.js"></script>
</body>
</html>
