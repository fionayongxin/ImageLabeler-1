<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Settings</title>

  <!-- Shared base styles (layout, typography, theme variables) -->
  <link rel="stylesheet" href="/training/css/base.css" />

  <!-- Settings page–specific styles -->
  <link rel="stylesheet" href="/training/css/settings.css" />
</head>

<body>

  <!-- ======================================================
       TOP NAVIGATION BAR
       Shared across all application pages
       ====================================================== -->
  <nav class="navbar">
    <div class="nav-brand">Vision Trainer</div>

    <ul class="nav-links">
      <li><a href="/training">Training</a></li>
      <li><a href="/experiments">Experiments</a></li>
      <li><a href="/datasets">Datasets</a></li>
      <li><a href="/settings" class="active">Settings</a></li>
    </ul>
  </nav>

  <!-- ======================================================
       MAIN CONTENT CONTAINER
       Uses shared trainer-container layout
       ====================================================== -->
  <div class="trainer-container">

    <!-- Page title -->
    <h1>Settings</h1>

    <!-- ======================================================
         SYSTEM INFORMATION
         Populated dynamically by JS
         ====================================================== -->
    <h2>System</h2>
    <div id="systemInfo" class="settings-kv">
      Loading system information...
    </div>

    <!-- ======================================================
         PATHS CONFIGURATION
         Read-only, populated by backend
         ====================================================== -->
    <h2>Paths</h2>
    <div id="pathsInfo" class="settings-kv">
      Loading paths...
    </div>

    <!-- ======================================================
         ENVIRONMENT DETAILS
         Python, CUDA, framework versions, etc.
         ====================================================== -->
    <h2>Environment</h2>
    <div id="envInfo" class="settings-kv">
      Loading environment details...
    </div>

    <!-- ======================================================
         TRAINING DEFAULTS
         Backend-defined default hyperparameters
         ====================================================== -->
    <h2>Training Defaults</h2>
    <div id="defaultsInfo" class="settings-kv">
      Loading training defaults...
    </div>

  </div>

  <!-- ======================================================
       PAGE SCRIPT
       Fetches and renders all settings data
       ====================================================== -->
  <script src="/training/js/settings.js"></script>

</body>
</html>
