<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Camera Capture</title>

  <!-- Base styles shared across pages -->
  <link rel="stylesheet" href="/capture/css/base.css" />

  <!-- Camera page–specific styles -->
  <link rel="stylesheet" href="/capture/css/camera.css" />
</head>

<body class="page-camera">

  <!-- ======================================================
       Main workspace container
       
       - Left: Live Basler preview
       - Right: Capture controls and recent images
  ====================================================== -->
  <div class="container workspace">

    <!-- ======================================================
         LIVE CAMERA PREVIEW
         ------------------------------------------------------
         IMPORTANT:
         - This is an <img>, NOT <video>
         - Source is MJPEG stream served by Python (Basler)
         - Proxied through Node at /api/camera/stream
         - Browser never accesses camera hardware
    ====================================================== -->
    <img
      id="video"
      class="camera-preview"
      src="/api/camera/stream"
      alt="Basler Live Preview"
    />

    <!-- ======================================================
         CONTROL PANEL
    ====================================================== -->
    <aside class="side-panel">
      <h1>Camera Capture</h1>

      <!-- Trigger server-side Basler capture -->
      <button id="captureBtn" type="button">
        Capture Photo
      </button>

      <!-- Recently captured images -->
      <div class="latest-panel">
        <h3>Latest Images</h3>

        <!-- Populated dynamically by app.js -->
        <div id="latestImages"></div>
      </div>

      <!-- Navigation / downstream workflow -->
      <div class="panel-footer">
        <a href="/labeler" class="btn-secondary">
          Label Image
        </a>
      </div>
    </aside>

  </div>

  <!-- ======================================================
       Frontend application logic
       - Handles UI only
       - Talks to backend APIs
       - NO camera logic inside
  ====================================================== -->
  <script src="/capture/js/app.js"></script>

</body>
</html>
